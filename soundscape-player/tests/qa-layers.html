<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <title>FCPlayer QA — layered sets</title>
  <link rel="stylesheet" href="../assets/player/fc-player.css">
  <style>
    :root, [data-theme='dark'] {
      --bg:#16150e; --panel:#1d1c13; --panel2:#232218; --text:#e8e3d1; --muted:#a49e89;
      --line:#2c2b1d; --gold:#d3ad4e; --shadow-lg:0 12px 48px rgba(0,0,0,.55);
      --font-display:'Fraunces', Georgia, serif;
    }
    body { background: var(--bg); color: var(--text); font-family: Georgia, serif; margin: 0; padding: 60px 24px; }
    h1 { font-family: var(--font-display); font-size: 24px; }
  </style>
</head>
<body>
  <h1>FCPlayer QA — layered sets</h1>
  <script src="../assets/player/fc-player.js"></script>
  <script>
    // Two layers on independent timelines:
    //   layer A: 2 segments x 5.05 s  -> pass 10.1  s (1010/100)
    //   layer B: 3 segments x 6.07 s  -> pass 18.21 s (1821/100)
    // 1010 and 1821 are relatively prime, so the combined cycle is
    // ~5.1 hours — the combination never audibly repeats within an hour.
    window.__inst = FCPlayer.mount({
      normalizeLayers: true,
      layers: [
        { title: 'Bed (10.1 s pass)', segments: ['fixtures/l0_0.wav', 'fixtures/l0_1.wav'] },
        { title: 'Motion (18.21 s pass)', segments: ['fixtures/l1_0.wav', 'fixtures/l1_1.wav', 'fixtures/l1_2.wav'] }
      ]
    });
  </script>
</body>
</html>
